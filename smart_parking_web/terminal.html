<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #1e1e1e; color: #d4d4d4; font: 14px/1.4 Consolas, "Courier New", monospace;
      display: flex; flex-direction: column; }
    #out { flex: 1; overflow-y: auto; padding: 12px 16px; white-space: pre-wrap; word-break: break-word; }
    .cmd { color: #4ec9b0; }
    .err { color: #f48771; }
    .ok { color: #b5cea8; }
    .route { color: #dcdcaa; font-weight: bold; }
    .target { color: #4fc1ff; font-weight: bold; }
    .occ { color: #808080; }
    .blk { color: #f48771; }
    .row { display: flex; align-items: center; padding: 8px 16px; border-top: 1px solid #333; }
    .row span { color: #4ec9b0; margin-right: 8px; }
    #in { flex: 1; background: transparent; border: 0; outline: 0; color: #d4d4d4; font: inherit; }
  </style>
</head>
<body>
  <div id="out"></div>
  <div class="row"><span>parking&gt;</span><input id="in" autocomplete="off" spellcheck="false" autofocus></div>

  <script src="js/lot.js"></script>
  <script src="js/search.js"></script>
  <script src="js/allocator.js"></script>
  <script src="js/terminal.js"></script>
</body>
</html>
